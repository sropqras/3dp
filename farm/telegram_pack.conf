# Farm enhancement pack for moonraker-telegram-bot (keys checked against bot/configuration.py, build 96a7fb9 2025-01).
# Applied per printer by scripts/telegram_pack.sh: these sections are REPLACED in telegram.conf, [bot] (token, chat)
# and anything else is left untouched.

[telegram_ui]
# one pinned status message, edited in place, instead of a new message every 5 %
pin_status_single_message: true
progress_update_message: true
# progress is silent; only farm alerts ring (RESPOND PREFIX=tgalarm / tgalarm_photo from the colour-change macros)
silent_progress: true
silent_status: true
buttons: [status,pause,resume],[macros,files,emergency]
# every command / macro sent from Telegram asks for confirmation first
require_confirmation: true
include_macros_in_command_list: true
# keep the phone macro list to the farm controls; calibration and SAVE_CONFIG macros stay on the web UI
hidden_macros: PID, PID_EXTRUDER, PID_BED, BED_MESH, G29, SHAPER, Z_AXI_CALIBRATE, CALIBRATE_Z_UI, Press_Advance_short, Press_Advance_long, BED_TRAMMING_1, BED_TRAMMING_2, BED_TRAMMING_AUTOMATED, BED_TRAMMING_CONTINUE, UI_BED_TRAM_CHECK, BED_LEVEL, NOZZLE_MID, HEAT, HELLO_WORLD, FC_RESUME, PAUSE_MACRO, DISABLE_STEPPERS

[status_message_content]
content: progress, height, filament_weight, print_duration, eta, finish_time, tgnotify_status, last_update_time
heaters: extruder, heater_bed
