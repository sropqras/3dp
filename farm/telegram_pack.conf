# Farm enhancement pack for moonraker-telegram-bot (keys checked against bot/configuration.py, build 96a7fb9 2025-01).
# Applied per printer by scripts/telegram_pack.sh: these sections are REPLACED in telegram.conf, [bot] (token, chat)
# and anything else is left untouched.

[progress_notification]
# progress every 5 %, every 5 mm of height, or every 10 min - the pinned status is edited in place, silently.
# (EnderV3SE had time = 5: an update every 5 seconds; the pack now owns this section so that can't come back)
percent: 5
height: 5
time: 600

[telegram_ui]
# one pinned status message, edited in place, instead of a new message every 5 %
pin_status_single_message: true
# false: no "Status has been updated / This message will be deleted" notice on every update (bot/notifications.py:146)
progress_update_message: false
# progress is silent; only farm alerts ring (RESPOND PREFIX=tgalarm / tgalarm_photo from the colour-change macros)
silent_progress: true
silent_status: true
# the bot's default layout (what the S1 Plus shows), minus shutdown and services: on a shared host (enders3dp runs
# five printers' Klipper) those would act on every printer, not this one. "power" is this printer's wall outlet
# through Farm Control's gates ([power printer] in its moonraker.conf); the farm drops it where that isn't wired
buttons: [pause,cancel,resume],[status,files,macros],[fw_restart,emergency,power]
# commands that ask "are you sure?" first. This bot version (96a7fb9) takes a LIST, not true/false: "true" matched
# nothing and switched confirmations OFF (cancel/emergency ran on one tap). Its own default list, plus macro.
require_confirmation: logs, logs_upload, shutdown, restart, cancel, fw_restart, emergency, reboot, power, bot_restart, macro
include_macros_in_command_list: true
# hide only the long calibration routines (they end in SAVE_CONFIG / run for minutes); everything else stays on the phone
hidden_macros: PID, PID_EXTRUDER, PID_BED, SHAPER, Z_AXI_CALIBRATE, CALIBRATE_Z_UI, Press_Advance_short, Press_Advance_long, BED_TRAMMING_AUTOMATED, HELLO_WORLD

[status_message_content]
content: progress, height, filament_weight, print_duration, eta, finish_time, tgnotify_status, last_update_time
heaters: extruder, heater_bed
