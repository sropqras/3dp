<!doctype html>
<html lang="en" data-page="printers">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farm Printers</title>
<script src="/static/ui.js"></script>
<link rel="stylesheet" href="/static/farm.css">
<style>
/* the Printers tab's own parts; shared look, themes and tokens are in farm.css (colours only via tokens) */
[hidden] { display: none !important; }
#hosts { display: grid; gap: calc(var(--gap) + 6px); }
.host .panel-h .hoststats { font-size: .86rem; }
.host .panel-b > .row .chip { white-space: normal; overflow-wrap: anywhere; }   /* long service names wrap on a phone */
.fcard { padding: 12px var(--pad); display: grid; gap: 10px; align-content: start; overflow-wrap: anywhere; }   /* long paths in Klipper errors */
.ph { display: flex; gap: 8px; align-items: flex-start; } .ph .name { font-weight: 700; font-size: 1.14rem; }
.phl { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; }
.ph .end { flex: none; display: flex; align-items: center; gap: 2px; margin-top: -3px; }
.fcard table { font-size: .86rem; } .fcard td, .fcard th { padding: 4px 6px; }
.fcard button { font-size: .86rem; padding: 3px 9px; min-height: 26px; } .fcard button.icon { font-size: 1rem; padding: 2px 6px; min-height: 30px; }
.fcard form.row input { max-width: 100%; }
/* files dialog: file list beside the diff */
.db { display: grid; grid-template-columns: 260px 1fr; min-height: 60vh; } @media (max-width: 800px) { .db { grid-template-columns: 1fr; } }
.db > * { min-width: 0; }
.files { border-right: 1px solid var(--line); padding: 8px; display: grid; gap: 2px; align-content: start; }
.files button { text-align: left; background: transparent; color: var(--text); font-weight: 500; border-radius: 6px; padding: 5px 8px; display: flex; justify-content: space-between; gap: 8px; }
.files button:hover { background: var(--hover); filter: none; } .files button.sel { background: var(--panel2); }
#cd-content { width: 100%; min-height: 45vh; font: .86rem/1.4 ui-monospace, monospace; }
#cd-preview { max-height: 40vh; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
</style>
</head>
<body>
<header class="appbar">
  <div class="bar1">
    <div class="brand">sropqras <span>Farm Control</span></div>
    <nav class="tabs"><a href="/">Dashboard</a><a href="/printers" class="on">Printers</a></nav>
    <div class="tools"><span class="you" data-you></span><span data-settings></span></div>
  </div>
  <div class="kpis" id="kpis"></div>
</header>
<main>
  <div id="hosts" data-panels="hosts"><div class="card pad dim">Reading every printer host… (the first read takes a few seconds)</div></div>
</main>
<dialog id="filesdlg" class="wide">
  <div class="dh"><b id="fd-title">Config</b><span class="dim" id="fd-sub"></span>
    <button class="ghost" id="fd-mode" onclick="toggleMode()">show file</button>
    <button class="ghost x" onclick="$('filesdlg').close()">Close</button></div>
  <div class="db"><div class="files" id="fd-files"></div><pre id="fd-body">choose a file</pre></div>
</dialog>
<dialog id="chgdlg">
  <div class="dh"><b id="cd-title">Stage a change</b><button class="ghost x" onclick="$('chgdlg').close()">Close</button></div>
  <div style="padding:14px 16px;display:grid;gap:10px">
    <div class="row">File <select id="cd-path" onchange="loadFileForEdit()"></select>
      <label><input type="radio" name="cdmode" value="key" checked onchange="cdMode()"> one setting</label>
      <label><input type="radio" name="cdmode" value="file" onchange="cdMode()"> edit the whole file</label></div>
    <div id="cd-key" class="row">[<input id="cd-section" placeholder="printer" style="width:150px">] <input id="cd-option" placeholder="max_velocity" style="width:150px">: <input id="cd-value" placeholder="200" style="width:120px"></div>
    <textarea id="cd-content" spellcheck="false" style="display:none"></textarea>
    <div class="row">Why <input id="cd-reason" style="flex:1;min-width:240px" placeholder="goes into FARM.md's change log"></div>
    <div class="row"><button onclick="submitChange()">Stage (nothing reaches the printer yet)</button><span class="dim" id="cd-msg"></span></div>
    <pre id="cd-preview"></pre>
  </div>
</dialog>
<script src="/static/operator.js"></script>
<script src="/static/printers.js"></script>
</body>
</html>
