<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farm Printers</title>
<style>
:root {
  --bg: #0a0e16; --panel: #111827; --panel2: #161f31; --line: #233047;
  --text: #e6ecf5; --muted: #8b98ae; --dim: #5d6a80;
  --teal: #2dd4bf; --violet: #a78bfa; --amber: #fbbf24; --red: #f87171; --green: #34d399; --blue: #60a5fa;
  --radius: 16px;
}
* { box-sizing: border-box; }
body { margin: 0; background: radial-gradient(1200px 600px at 10% -10%, #1b2440 0%, transparent 60%), var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; min-height: 100vh; }
header { display: flex; align-items: center; gap: 18px; padding: 18px 28px; flex-wrap: wrap; }
.brand { font-weight: 800; font-size: 20px; } .brand span { background: linear-gradient(90deg, var(--teal), var(--violet)); -webkit-background-clip: text; color: transparent; }
nav a { color: var(--muted); text-decoration: none; padding: 6px 12px; border-radius: 10px; border: 1px solid transparent; }
nav a.on { color: var(--text); border-color: var(--line); background: var(--panel); }
.kpis { display: flex; gap: 10px; flex-wrap: wrap; margin-left: auto; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px 12px; min-width: 96px; }
.kpi b { display: block; font-size: 17px; } .kpi small { color: var(--muted); }
main { padding: 0 28px 40px; display: grid; gap: 22px; } main > * { min-width: 0; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1.4px; color: var(--muted); margin: 6px 0 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(400px, 100%), 1fr)); } .grid > * { min-width: 0; }
.card { background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 10px; }
.ph { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; } .ph .name { font-weight: 700; font-size: 16px; }
.chip { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 1px 8px; font-size: 12px; white-space: nowrap; }
.ok { color: var(--green); } .bad { color: var(--red); } .warn { color: var(--amber); } .dim { color: var(--dim); font-size: 12px; }
.chip.ok { border-color: rgba(52,211,153,.4); } .chip.bad { border-color: rgba(248,113,113,.5); } .chip.warn { border-color: rgba(251,191,36,.5); }
table { width: 100%; border-collapse: collapse; font-size: 12px; } td, th { padding: 4px 6px; border-bottom: 1px solid rgba(35,48,71,.6); text-align: left; vertical-align: top; }
th { color: var(--muted); font-weight: 600; }
details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); } .row b { color: var(--text); font-weight: 600; }
button { background: linear-gradient(90deg, var(--teal), var(--violet)); color: #071018; border: 0; border-radius: 8px; padding: 4px 10px; font-weight: 700; cursor: pointer; font-size: 12px; }
button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
a.lnk { color: var(--blue); font-size: 12px; text-decoration: none; }
input { background: #0b1220; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font: inherit; font-size: 12px; }
.host { display: grid; gap: 10px; }
dialog { width: min(1000px, calc(100vw - 32px)); max-height: calc(100vh - 32px); padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); color: var(--text); overflow: auto; }
dialog::backdrop { background: rgba(3,6,12,.72); }
.dh { display: flex; gap: 10px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; } .dh .x { margin-left: auto; }
.db { display: grid; grid-template-columns: 260px 1fr; min-height: 60vh; } @media (max-width: 800px) { .db { grid-template-columns: 1fr; } }
.files { border-right: 1px solid var(--line); padding: 8px; display: grid; gap: 2px; align-content: start; }
.files button { text-align: left; background: transparent; color: var(--text); font-weight: 500; border-radius: 6px; padding: 5px 8px; display: flex; justify-content: space-between; gap: 8px; }
.files button.sel { background: var(--panel2); }
pre { margin: 0; padding: 12px 14px; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
select { background: #0b1220; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font-size: 12px; }
.add { color: var(--green); } .del { color: var(--red); } .hunk { color: var(--violet); }
@media (max-width: 600px) { header, main { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body>
<header>
  <div class="brand">sropqras <span>Farm Control</span></div>
  <nav><a href="/">Dashboard</a> <a href="/printers" class="on">Printers</a></nav>
  <span class="dim" data-you></span>
  <div class="kpis" id="kpis"></div>
</header>
<main>
  <div id="hosts"></div>
</main>
<dialog id="filesdlg">
  <div class="dh"><b id="fd-title">Config</b><span class="dim" id="fd-sub"></span>
    <button class="ghost" id="fd-mode" onclick="toggleMode()">show file</button>
    <button class="ghost x" onclick="$('filesdlg').close()">Close</button></div>
  <div class="db"><div class="files" id="fd-files"></div><pre id="fd-body">choose a file</pre></div>
</dialog>
<dialog id="chgdlg">
  <div class="dh"><b id="cd-title">Stage a change</b><button class="ghost x" onclick="$('chgdlg').close()">Close</button></div>
  <div style="padding:14px 16px;display:grid;gap:10px">
    <div class="row">File <select id="cd-path" onchange="loadFileForEdit()"></select>
      <label><input type="radio" name="cdmode" value="key" checked onchange="cdMode()"> one setting</label>
      <label><input type="radio" name="cdmode" value="file" onchange="cdMode()"> edit the whole file</label></div>
    <div id="cd-key" class="row">[<input id="cd-section" placeholder="printer" style="width:150px">] <input id="cd-option" placeholder="max_velocity" style="width:150px">: <input id="cd-value" placeholder="200" style="width:120px"></div>
    <textarea id="cd-content" spellcheck="false" style="display:none;width:100%;min-height:45vh;background:#0b1220;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font:12px/1.4 ui-monospace,monospace"></textarea>
    <div class="row">Why <input id="cd-reason" style="flex:1;min-width:240px" placeholder="goes into FARM.md's change log"></div>
    <div class="row"><button onclick="submitChange()">Stage (nothing reaches the printer yet)</button><span class="dim" id="cd-msg"></span></div>
    <pre id="cd-preview" style="max-height:40vh;overflow:auto;border:1px solid var(--line);border-radius:8px"></pre>
  </div>
</dialog>
<script src="/static/operator.js"></script>
<script src="/static/printers.js"></script>
</body>
</html>
