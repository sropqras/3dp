<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farm Control</title>
<style>
:root {
  --bg: #0a0e16; --panel: #111827; --panel2: #161f31; --line: #233047;
  --text: #e6ecf5; --muted: #8b98ae; --dim: #5d6a80;
  --teal: #2dd4bf; --violet: #a78bfa; --amber: #fbbf24; --red: #f87171; --green: #34d399; --blue: #60a5fa;
  --radius: 16px;
}
* { box-sizing: border-box; }
body { margin: 0; background: radial-gradient(1200px 600px at 10% -10%, #1b2440 0%, transparent 60%),
       radial-gradient(900px 500px at 110% 0%, #2a1b40 0%, transparent 55%), var(--bg);
  color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; min-height: 100vh; }
header { display: flex; align-items: center; gap: 24px; padding: 18px 28px; flex-wrap: wrap; }
.brand { font-weight: 800; font-size: 20px; letter-spacing: .3px; }
.brand span { background: linear-gradient(90deg, var(--teal), var(--violet)); -webkit-background-clip: text; color: transparent; }
.kpis { display: flex; gap: 12px; flex-wrap: wrap; margin-left: auto; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; min-width: 120px; }
.kpi b { display: block; font-size: 18px; } .kpi small { color: var(--muted); }
main { padding: 0 28px 40px; display: grid; gap: 22px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1.4px; color: var(--muted); margin: 6px 0 10px; }
.grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); }
.card { background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line);
  border-radius: var(--radius); overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.ph { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; }
.ph .name { font-weight: 700; font-size: 16px; } .ph .host { color: var(--dim); font-size: 12px; }
.pill { margin-left: auto; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; text-transform: capitalize; }
.s-printing { background: rgba(45,212,191,.15); color: var(--teal); }
.s-paused { background: rgba(251,191,36,.15); color: var(--amber); }
.s-standby, .s-complete, .s-cancelled { background: rgba(139,152,174,.15); color: var(--muted); }
.s-error, .s-offline { background: rgba(248,113,113,.15); color: var(--red); }
.alert { margin: 0 16px 10px; padding: 10px 12px; border-radius: 10px; background: rgba(251,191,36,.12);
  border: 1px solid rgba(251,191,36,.45); color: var(--amber); font-weight: 600; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(251,191,36,.08); } }
.body { display: grid; grid-template-columns: 1fr 150px; gap: 14px; padding: 0 16px 16px; }
.cam { position: relative; border-radius: 12px; overflow: hidden; background: #05070b; aspect-ratio: 16/9; grid-column: 1 / -1; cursor: pointer; }
.cam img { width: 100%; height: 100%; object-fit: cover; display: block; transition: filter .3s; }
.cam.boost img { filter: brightness(1.7) contrast(1.15) saturate(1.1); }
.cam .tag { position: absolute; top: 8px; left: 8px; font-size: 11px; background: rgba(0,0,0,.55); padding: 2px 8px; border-radius: 6px; color: var(--muted); }
.ring { position: relative; display: grid; place-items: center; align-self: start; }
.ring .pct { position: absolute; inset: 0; display: grid; place-items: center; font-size: 22px; font-weight: 800; }
.facts { display: grid; gap: 8px; align-content: start; }
.job { font-weight: 600; } .labels { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 2px 8px; font-size: 12px; }
.row { display: flex; gap: 14px; color: var(--muted); font-size: 13px; flex-wrap: wrap; } .row b { color: var(--text); font-weight: 600; }
.temp { display: grid; grid-template-columns: 54px 1fr 92px; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.bar { height: 6px; background: #0b1220; border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--blue), var(--red)); }
.spool { display: inline-flex; align-items: center; gap: 6px; } .sw { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); }
.audit { font-size: 12px; color: var(--green); } .audit.bad { color: var(--amber); cursor: help; }
.split { display: grid; gap: 18px; grid-template-columns: 2fr 1fr; } @media (max-width: 1100px) { .split { grid-template-columns: 1fr; } }
.pad { padding: 16px; }
.bh { display: flex; align-items: baseline; gap: 12px; } .bh .big { font-size: 24px; font-weight: 800; }
.prog { height: 10px; background: #0b1220; border-radius: 99px; overflow: hidden; margin: 10px 0 14px; }
.prog i { display: block; height: 100%; background: linear-gradient(90deg, var(--green), var(--teal)); }
.brow { display: grid; grid-template-columns: 70px 1fr 54px; align-items: center; gap: 10px; margin: 3px 0; }
.brow .rn { color: var(--muted); font-weight: 700; font-size: 12px; } .brow .rc { color: var(--dim); font-size: 12px; text-align: right; }
.cells { display: flex; flex-wrap: wrap; gap: 3px; }
.cell { width: 11px; height: 11px; border-radius: 3px; background: #1e293b; }
.c-sliced { background: var(--blue); } .c-queued { background: var(--violet); } .c-printing { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
.c-done { background: var(--green); } .c-failed { background: var(--red); }
.legend { display: flex; gap: 14px; color: var(--muted); font-size: 12px; margin-top: 10px; flex-wrap: wrap; } .legend .cell { display: inline-block; vertical-align: -1px; margin-right: 4px; }
.note { color: var(--dim); font-size: 12px; margin-top: 8px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
td { padding: 8px 10px; border-bottom: 1px solid rgba(35,48,71,.5); }
.st { font-size: 12px; font-weight: 700; } .st.completed { color: var(--green); } .st.cancelled, .st.error, .st.FAILED { color: var(--red); }
.st.uploaded, .st.ok { color: var(--violet); } .st.in_progress { color: var(--teal); }
.spools { display: grid; gap: 10px; }
.sp { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.sp .disc { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line); box-shadow: inset 0 0 0 6px rgba(0,0,0,.35); }
.sp .t { font-weight: 600; } .sp .m { color: var(--muted); font-size: 12px; }
.sp .ctl { display: flex; gap: 8px; margin-top: 6px; align-items: center; flex-wrap: wrap; }
input, select { background: #0b1220; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font: inherit; font-size: 12px; }
input[type=number] { width: 78px; } button { background: linear-gradient(90deg, var(--teal), var(--violet)); color: #071018; border: 0; border-radius: 8px; padding: 6px 12px; font-weight: 700; cursor: pointer; }
button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.stamp { color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<header>
  <div class="brand">sropqras <span>Farm Control</span></div>
  <div class="kpis" id="kpis"></div>
</header>
<main>
  <section><h2>Printers</h2><div class="grid" id="printers"></div></section>
  <section class="split">
    <div>
      <h2>Batches</h2><div id="batches"></div>
      <h2 style="margin-top:22px">Jobs</h2><div class="card"><table id="jobs"></table></div>
    </div>
    <div>
      <h2>Spool inventory</h2>
      <div class="card pad"><div class="spools" id="spools"></div>
        <div class="ctl" style="margin-top:12px; display:flex; gap:8px"><button onclick="saveInv()">Save inventory</button>
        <button class="ghost" onclick="addSpool()">+ Spool</button><span class="stamp" id="invmsg"></span></div>
      </div>
    </div>
  </section>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hm = (s) => { if (s == null || !isFinite(s)) return "–"; s = Math.max(0, Math.round(s / 60)); return s >= 60 ? `${Math.floor(s/60)}h ${s%60}m` : `${s}m`; };
const boost = JSON.parse(localStorageSafe("boost") || "{}");
let data = null, inv = null, invDirty = false;

function localStorageSafe(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

function ring(p, color) {
  const r = 52, c = 2 * Math.PI * r, off = c * (1 - p);
  return `<svg viewBox="0 0 130 130" width="130" height="130"><circle cx="65" cy="65" r="${r}" fill="none" stroke="#0b1220" stroke-width="12"/>
    <circle cx="65" cy="65" r="${r}" fill="none" stroke="${color}" stroke-width="12" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 65 65)"/></svg>`;
}

function tempRow(label, t) {
  const [a, tg] = t || [0, 0], pct = Math.min(100, a / 260 * 100);
  return `<div class="temp"><span>${label}</span><div class="bar"><i style="width:${pct}%"></i></div><span><b style="color:var(--text)">${a.toFixed(0)}°</b> / ${tg.toFixed(0)}°</span></div>`;
}

function printerCard(p) {
  if (!p.online) return `<div class="card"><div class="ph"><span class="name">${esc(p.name)}</span><span class="host">${esc(p.host)}</span>
    <span class="pill s-offline">offline</span></div><div class="alert">${esc(p.error || "unreachable")}</div></div>`;
  const state = p.klipper !== "ready" ? "error" : (p.paused ? "paused" : p.job);
  const color = state === "paused" ? "var(--amber)" : state === "printing" ? "var(--teal)" : "var(--dim)";
  const spool = (inv?.spools || []).filter((s) => s.location === p.name)
    .map((s) => `<span class="spool"><span class="sw" style="background:${esc(s.hex)}"></span>${esc(s.colour)} ${esc(s.material)}</span>`).join(" ") || "<span class='stamp'>no spool assigned</span>";
  const audit = p.audit_fails == null ? "" : p.audit_fails.length
    ? `<span class="audit bad" title="${esc(p.audit_fails.map((f) => f.rule).join("\n"))}">⚠ ${p.audit_fails.length} baseline gap${p.audit_fails.length > 1 ? "s" : ""}</span>`
    : `<span class="audit">✓ farm baseline</span>`;
  const run = p.run ? `<div class="job">${esc(p.run.job)}</div><div class="labels">${p.run.labels.map((l) => `<span class="chip">${esc(l)}</span>`).join("")}</div>`
                    : `<div class="job">${esc(p.file || "idle")}</div>`;
  const next = p.next ? `<div class="row">Next: <b>${esc(p.next.what)}</b> in <b>${hm(p.next.in_s)}</b></div>` : "";
  const active = ["printing", "paused"].includes(p.job);
  return `<div class="card">
    <div class="ph"><span class="name">${esc(p.name)}</span><span class="host">${esc(p.host)}</span><span class="pill s-${state}">${esc(state)}</span></div>
    ${p.alert ? `<div class="alert">⚑ ${esc(p.alert)}</div>` : ""}
    <div class="body">
      ${p.has_cam ? `<div class="cam ${boost[p.name] !== false ? "boost" : ""}" onclick="toggleBoost('${esc(p.name)}')" title="click: toggle low-light boost">
        <img id="cam-${esc(p.name)}" src="/api/cam/${encodeURIComponent(p.name)}?t=${Date.now()}" alt="${esc(p.name)} camera">
        <span class="tag">${boost[p.name] !== false ? "low-light boost" : "raw"}</span></div>` : ""}
      <div class="facts">
        ${run}
        <div class="row">Elapsed <b>${active ? hm(p.elapsed) : "–"}</b> ETA <b>${active ? hm(p.eta_s) : "–"}</b></div>
        ${next}
        ${tempRow("Nozzle", p.nozzle)}${tempRow("Bed", p.bed)}
        <div class="row">Speed <b>${Math.round(p.speed * 100)}%</b> Flow <b>${Math.round(p.flow * 100)}%</b></div>
        <div class="row">${spool}</div>
        <div>${audit}</div>
      </div>
      <div class="ring">${ring(active ? p.progress : 0, color)}<div class="pct">${active ? Math.round(p.progress * 100) + "%" : "–"}</div></div>
    </div></div>`;
}

function batchCard(b) {
  const rows = b.rows.map((r) => `<div class="brow"><span class="rn">${esc(r.name)}</span>
      <div class="cells">${r.cells.map((c) => `<span class="cell c-${c.status}" title="${esc(c.label)}: ${c.status}"></span>`).join("")}</div>
      <span class="rc">${r.cells.filter((c) => c.status === "done").length}/${r.cells.length}</span></div>`).join("");
  return `<div class="card pad"><div class="bh"><span class="big">${b.done} / ${b.total}</span><span>${esc(b.name)}</span>
      <span class="stamp" style="margin-left:auto">≈ ${Math.round(b.hours_left)} printer-hours left</span></div>
    <div class="prog"><i style="width:${(b.done / Math.max(1, b.total)) * 100}%"></i></div>${rows}
    <div class="legend">${["planned","sliced","queued","printing","done","failed"].map((s) => `<span><span class="cell c-${s}"></span>${s}</span>`).join("")}</div>
    <div class="note">${esc(b.note)}</div></div>`;
}

function jobsTable(runs) {
  return `<tr><th>Job</th><th>Printer</th><th>Plates</th><th>Estimate</th><th>PETG</th><th>Status</th></tr>` +
    runs.map((r) => `<tr><td>${esc(r.job)}<div class="stamp">${esc(r.started)}</div></td><td>${esc(r.printer)}</td>
      <td>${r.labels.map((l) => `<span class="chip">${esc(l)}</span>`).join(" ")}</td><td>${esc(r.estimate || "–")}</td>
      <td>${r.grams ? r.grams.toFixed(0) + " g" : "–"}</td><td><span class="st ${esc(String(r.status).split(":")[0])}">${esc(String(r.status).split(":")[0])}</span></td></tr>`).join("");
}

function renderSpools() {
  const locs = ["shelf", ...data.printers.map((p) => p.name)];
  $("spools").innerHTML = inv.spools.map((s, i) => {
    const pct = Math.max(0, Math.min(100, (s.remaining_g / Math.max(1, s.weight_g)) * 100));
    return `<div class="sp"><div class="disc" style="background:${esc(s.hex)}"></div><div>
      <div class="t">${esc(s.colour)} <span class="stamp">${esc(s.brand)} ${esc(s.material)} · ${esc(s.id)}</span></div>
      <div class="bar" style="margin:6px 0"><i style="width:${pct}%; background:linear-gradient(90deg,var(--green),var(--teal))"></i></div>
      <div class="ctl"><input type="number" value="${s.remaining_g}" oninput="setSp(${i},'remaining_g',+this.value)"> g left
        <select onchange="setSp(${i},'location',this.value)">${locs.map((l) => `<option ${l === s.location ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>
        <input type="color" value="${esc(s.hex)}" oninput="setSp(${i},'hex',this.value)" title="colour">
        <input value="${esc(s.colour)}" oninput="setSp(${i},'colour',this.value)" style="width:110px" title="colour name"></div>
    </div></div>`;
  }).join("");
}

function setSp(i, k, v) { inv.spools[i][k] = v; invDirty = true; $("invmsg").textContent = "unsaved changes"; }
function addSpool() {
  const n = inv.spools.length + 1;
  inv.spools.push({ id: `SP-${String(n).padStart(3, "0")}`, material: "PETG", brand: "Creality", colour: "New", hex: "#888888", weight_g: 1000, remaining_g: 1000, location: "shelf" });
  invDirty = true; renderSpools();
}
async function saveInv() {
  const r = await fetch("/api/inventory", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(inv) });
  $("invmsg").textContent = r.ok ? "saved" : "save failed"; invDirty = !r.ok; refresh();
}
function toggleBoost(name) { boost[name] = boost[name] === false; localStorageSafe("boost", JSON.stringify(boost)); render(); }

function render() {
  const P = data.printers, online = P.filter((p) => p.online).length, printing = P.filter((p) => p.job === "printing").length;
  const b = data.batches[0];
  const petg = (inv?.spools || []).filter((s) => s.material === "PETG").reduce((a, s) => a + (+s.remaining_g || 0), 0);
  $("kpis").innerHTML = [
    [`${online}/${P.length}`, "printers online"], [printing, "printing"],
    b ? [`${b.done}/${b.total}`, "plates done"] : null, b ? [`${Math.round(b.hours_left)} h`, "batch left"] : null,
    [`${(petg / 1000).toFixed(2)} kg`, "PETG on hand"], [new Date(data.time * 1000).toLocaleTimeString(), "updated"],
  ].filter(Boolean).map(([v, l]) => `<div class="kpi"><b>${esc(v)}</b><small>${esc(l)}</small></div>`).join("");
  $("printers").innerHTML = P.map(printerCard).join("");
  $("batches").innerHTML = data.batches.map(batchCard).join("");
  $("jobs").innerHTML = jobsTable(data.runs);
  if (!invDirty && !document.activeElement?.closest?.("#spools")) renderSpools();
}

async function refresh() {
  try {
    data = await (await fetch("/api/overview")).json();
    if (!invDirty) inv = JSON.parse(JSON.stringify(data.inventory));
    render();
  } catch (e) { $("kpis").innerHTML = `<div class="kpi"><b style="color:var(--red)">offline</b><small>farm server</small></div>`; }
}
refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
