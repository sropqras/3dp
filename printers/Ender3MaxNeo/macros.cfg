[include farm_macros.cfg]   # farm macro library - the same file on every farm printer
[gcode_macro START_PRINT]          # START_PRINT 
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(70)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(220)|float %}
    # Clear any stale pause state, otherwise PAUSE answers "Print already paused" and the print carries on
    CLEAR_PAUSE
    # Heat bed for probing
    M190 S{BED_TEMP}
    # Use absolute coordinates
    G90
    # Home the printer
    G28
    # If you are generating a new bed mesh:
    BED_MESH_CALIBRATE
    # Move the nozzle near the bed
    #G1 Z5 F3000
    #KAMP Smart Park
    #Smart_Park
    # Set and wait for nozzle to reach printing temperature
    M109 S{EXTRUDER_TEMP}
    # Start printing!
    #KAMP Line Purge
    LINE_PURGE


[gcode_macro M600]
description: Colour change - park and prompt; filament only moves when the operator presses a button
gcode:
    SET_GCODE_VARIABLE MACRO=_FARM_HEAT_FOR_FILAMENT VARIABLE=temp VALUE={printer.extruder.target}
    # No auto-unload: this printer has no runout sensor, and an unattended eject lets the loose
    # filament end spring back and tangle on the spool. The operator unloads while holding it.
    PAUSE_MACRO
    _COLOUR_CHANGE_PROMPT

[gcode_macro PAUSE_MACRO]
description: Pause and park (paused idle timeout comes from _CLIENT_VARIABLE)
gcode:
    PAUSE

[gcode_macro FC_RESUME]
description: Resume after a filament change (fluidd RESUME handles reheat and unretract)
gcode:
    RESUME

[gcode_macro _COLOUR_CHANGE_PROMPT]
gcode:
    # Telegram (moonraker-telegram-bot): loud alert + camera photo so someone comes to swap
    RESPOND PREFIX=tgalarm_photo MSG="Ender3MaxNeo: colour change - load the next colour, PURGE, then RESUME"
    RESPOND TYPE=command MSG="action:prompt_begin Colour change"
    RESPOND TYPE=command MSG="action:prompt_text Hold the filament, press UNLOAD and clip the old end to its spool."
    RESPOND TYPE=command MSG="action:prompt_text Insert the next colour, press LOAD, PURGE until it runs clean, remove the blob, wipe the nozzle, then RESUME."
    RESPOND TYPE=command MSG="action:prompt_button UNLOAD|UNLOAD_FILAMENT|error"
    RESPOND TYPE=command MSG="action:prompt_button LOAD 75mm|LOAD_FILAMENT|primary"
    RESPOND TYPE=command MSG="action:prompt_button PURGE 45mm|PURGE|secondary"
    RESPOND TYPE=command MSG="action:prompt_footer_button RESUME|_COLOUR_CHANGE_RESUME|warning"
    RESPOND TYPE=command MSG="action:prompt_show"

# 12 h safety cap on a pause: all heaters off, motors keep holding position so the print can still resume
[delayed_gcode _PAUSE_HARD_STOP]
gcode:
    {% if printer.pause_resume.is_paused %}
      SET_GCODE_VARIABLE MACRO=_PAUSE_RESUME_HOOK VARIABLE=bed_temp VALUE={printer.heater_bed.target}
      TURN_OFF_HEATERS
      RESPOND TYPE=echo MSG="Paused 12 h: all heaters off, motors still holding. RESUME reheats the bed - check the plate is still stuck first."
      RESPOND PREFIX=tgalarm MSG="Ender3MaxNeo: paused 12 h - all heaters OFF. Check the plates are still stuck before RESUME."
    {% endif %}

[gcode_macro _PAUSE_RESUME_HOOK]
variable_bed_temp: 0
gcode:
    UPDATE_DELAYED_GCODE ID=_PAUSE_HARD_STOP DURATION=0
    {% if bed_temp > 0 and printer.heater_bed.target == 0 %}
      RESPOND TYPE=echo MSG="Reheating bed to {bed_temp} before resuming"
      M190 S{bed_temp}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_PAUSE_RESUME_HOOK VARIABLE=bed_temp VALUE=0

[gcode_macro _COLOUR_CHANGE_RESUME]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    # relieve nozzle pressure after PURGE so it doesn't ooze a ring across the plate on the way back
    M83
    G1 E-2 F1800
    G4 P2000
    RESUME

[gcode_macro UNLOAD_FILAMENT]
gcode:
    _FARM_HEAT_FOR_FILAMENT
    SAVE_GCODE_STATE NAME=UNLOAD_state
    {% set z_lift = params.z_lift|default(50)|int %}
    {% set axis_max = printer.toolhead.axis_maximum %}
    {% set pos = printer.toolhead.position %}

    {% set z_diff = axis_max.z - pos.z %}
    {% set z_safe_lift = [ z_lift, z_diff ] | min%}
    
    G91                   # relative positioning
    G0 Z{ z_safe_lift }
    # Reset extruder position
    G92 E0
    G1 E5.0 F300        # extrude a little
    G1 E-50 F{ 10 * 60 } # perform the unload
    G1 E-50 F{ 5 * 60 }   # finish the unload
    RESTORE_GCODE_STATE NAME=UNLOAD_state

[gcode_macro PURGE]
gcode:
    _FARM_HEAT_FOR_FILAMENT
    SAVE_GCODE_STATE NAME=PURGE_state
    G91                   # relative coords
    G1 E45.0 F{ 5 * 60 }  # purge
    RESTORE_GCODE_STATE NAME=PURGE_state

[gcode_macro LOAD_FILAMENT]
gcode:
    _FARM_HEAT_FOR_FILAMENT
    SAVE_GCODE_STATE NAME=LOAD_state
    G91                   # Relative coords
    G1 E50 F{ 5 * 60 }  # extrude
    G4 P{ 0.9 * 1000 }    # dwell (ms)
    G1 E25.0 F{ 5 * 60 }  # extrude a little more
    _ENABLE_FS
    RESTORE_GCODE_STATE NAME=LOAD_state

[gcode_macro BED_TRAMMING_1]
gcode:
  {% set BED_TEMP = params.BED_TEMP|default(70)|float %}
  M140 S{BED_TEMP}	
  G28
  M190 S{BED_TEMP}
  SCREWS_TILT_CALCULATE

[gcode_macro PRINT_END]
description: End of printing
gcode:
    # Get safe machine boundaries dynamically
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% set max_y = printer.toolhead.axis_maximum.y|float %}
    
    # Calculate safe Z lift (lift 10mm, or max out safely)
    {% set z_safe = 0.0 %}
    {% if act_z < (max_z - 10.0) %}
      {% set z_safe = 10.0 %}
    {% else %}
      {% set z_safe = max_z - act_z %}
    {% endif %}

    G91 ;Relative positioning
    G1 E-2 F2700 ;Retract a bit
    G1 E-2 Z0.2 F2400 ;Retract and raise Z slightly to prevent blob
    G1 X5 Y5 F3000 ;Wipe out
    G1 Z{z_safe} F900 ;Raise Z safely without hitting the gantry
    G90 ;Absolute positioning
    G1 X0 Y{max_y - 5.0} F3000 ;Present print at the very front of the bed
    
    M106 S0 ;Turn-off fan
    TURN_OFF_HEATERS
    M84 X Y E ;Disable all steppers but Z to prevent gantry sag
    # BEEP ; Uncomment if you have a display buzzer configured

[gcode_macro BED_TRAMMING_AUTOMATED]
description: Heated automated bed leveling loop. Adjust knobs until the macro exits.
gcode:
  {% set BED_TEMP = params.BED_TEMP|default(70)|float %}
  
  # 1. Turn on heaters and home
  RESPOND MSG="Heating bed to {BED_TEMP}°C for calibration..."
  M140 S{BED_TEMP}	
  G28
  M190 S{BED_TEMP}
  
  # 2. Run the automated leveling checks loop
  RESPOND MSG="Starting automated bed leveling loop. Adjust knobs as instructed in the console."
  SCREWS_TILT_CALCULATE MAX_DEVIATION=0.05 RETRY_TOLERANCE=0.02

[gcode_macro BED_TRAMMING_CONTINUE]
description: Use this to manually run another check if you paused or adjusted mid-way.
gcode:
  SCREWS_TILT_CALCULATE MAX_DEVIATION=0.05 RETRY_TOLERANCE=0.02

[gcode_macro UI_BED_TRAM_CHECK]
description: Preheats bed and launches Fluidd's visual leveling script
gcode:
  {% set BED_TEMP = params.BED_TEMP|default(70)|float %}
  G28
  M190 S{BED_TEMP}
  SCREWS_TILT_CALCULATE

[gcode_macro _FARM_HEAT_FOR_FILAMENT]
description: the colour-change buttons need a hot nozzle - after a long pause the idle timeout has turned it off
variable_temp: 0
gcode:
    {% set t = printer["gcode_macro _FARM_HEAT_FOR_FILAMENT"].temp|float %}
    {% set t = t if t > 170 else 240 %}
    {% if printer.extruder.temperature < t - 10 %}
      RESPOND TYPE=echo MSG="Heating the nozzle to {t} C for the filament change"
      M109 S{t}
    {% endif %}

[gcode_macro _FARM_PRINTER]
description: Utility | this printer's values for the farm macro library (farm_macros.cfg)
variable_nozzle_temp: 220
variable_bed_temp: 70
variable_pid_nozzle: 220
variable_pid_bed: 70
variable_sensor: ''
gcode:
    FARM_INFO

