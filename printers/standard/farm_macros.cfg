# Farm macro library - the SAME file on every farm printer (Farm Control, farm/standard.py).
# Source: printers/standard/farm_macros.cfg in the farm repo. Don't edit it on a printer: change it in the repo,
# then Printers tab -> Stage fix "farm macro library is current" on each printer and Apply.
#
# The shared utility and tuning macros every printer inherited from the same ancestor file, with the per-printer
# numbers taken out into [gcode_macro _FARM_PRINTER] (in the printer's own macros.cfg). Each description starts
# with its group - Print | Filament | Bed | Tune | Utility - which is also how Fluidd's macro panel is arranged.
# Printer-specific macros (START_PRINT, PRINT_END, M600, LOAD/UNLOAD/PURGE, PAUSE/RESUME/CANCEL) stay in the
# printer's own files; the farm audit checks those.

[gcode_macro FARM_INFO]
description: Utility | this printer's farm values and the macro library version
variable_version: '2026-10-23.1'
gcode:
    {% set f = printer["gcode_macro _FARM_PRINTER"] %}
    RESPOND MSG="farm macro library {printer['gcode_macro FARM_INFO'].version} | nozzle {f.nozzle_temp} C, bed {f.bed_temp} C | PID at {f.pid_nozzle}/{f.pid_bed} C | filament sensor {f.sensor if f.sensor else 'none'}"

[gcode_macro COOL]
description: Utility | all heaters off
gcode:
    TURN_OFF_HEATERS

[gcode_macro HEAT]
description: Utility | home, nozzle to TEMP (default: this printer's usual), lift 10 mm
gcode:
    {% set t = params.TEMP|default(printer["gcode_macro _FARM_PRINTER"].nozzle_temp)|float %}
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={t}
    G28
    G1 Z10 F3000

[gcode_macro NOZZLE_MID]
description: Utility | home, nozzle to the middle of the bed at Z 10
gcode:
    G28
    G1 X{printer.toolhead.axis_maximum.x / 2} Y{printer.toolhead.axis_maximum.y / 2} Z10 F6000

[gcode_macro DISABLE_STEPPERS]
description: Utility | motors off (X, Y, E - Z holds)
gcode:
    M84 X Y E

[gcode_macro BED_MESH]
description: Bed | heat the bed to BED_TEMP, home, new mesh, SAVE_CONFIG (Klipper restarts)
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(printer["gcode_macro _FARM_PRINTER"].bed_temp)|float %}
    M140 S{BED_TEMP}
    G28
    M190 S{BED_TEMP}
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE
    TURN_OFF_HEATERS
    SAVE_CONFIG

[gcode_macro BED_TRAMMING_2]
description: Bed | screw adjustments from the probe (SCREWS_TILT_CALCULATE)
gcode:
    SCREWS_TILT_CALCULATE

[gcode_macro CALIBRATE_Z_UI]
description: Bed | home, nozzle to the middle, open Fluidd's Z-offset tool (PROBE_CALIBRATE)
gcode:
    G28
    G1 X{printer.toolhead.axis_maximum.x / 2} Y{printer.toolhead.axis_maximum.y / 2} Z10 F6000
    PROBE_CALIBRATE

[gcode_macro PID_EXTRUDER]
description: Tune | PID-tune the nozzle at TARGET (default: this printer's), then SAVE_CONFIG (Klipper restarts)
gcode:
    {% set t = params.TARGET|default(printer["gcode_macro _FARM_PRINTER"].pid_nozzle)|float %}
    PID_CALIBRATE HEATER=extruder TARGET={t}
    TURN_OFF_HEATERS
    SAVE_CONFIG

[gcode_macro PID_BED]
description: Tune | PID-tune the bed at TARGET (default: this printer's), then SAVE_CONFIG (Klipper restarts)
gcode:
    {% set t = params.TARGET|default(printer["gcode_macro _FARM_PRINTER"].pid_bed)|float %}
    PID_CALIBRATE HEATER=heater_bed TARGET={t}
    TURN_OFF_HEATERS
    SAVE_CONFIG

[gcode_macro TUNE_PRESSURE_ADVANCE]
description: Tune | arm a pressure-advance tower (START, FACTOR per mm), then print a tall square tower; PA = START + height x FACTOR
gcode:
    {% set start = params.START|default(0)|float %}
    {% set factor = params.FACTOR|default(0.005)|float %}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=1 ACCEL=500
    TUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE PARAMETER=ADVANCE START={start} FACTOR={factor}
    RESPOND MSG="PA tower armed: PA = {start} + height_mm x {factor}. Print the tower now; a restart clears it."

[gcode_macro TUNE_TEMPERATURE]
description: Tune | arm a temperature tower: START C, STEP_DELTA C every STEP_HEIGHT mm (default 240, -5 every 10 mm)
gcode:
    {% set start = params.START|default(240)|float %}
    {% set delta = params.STEP_DELTA|default(-5)|float %}
    {% set height = params.STEP_HEIGHT|default(10)|float %}
    TUNING_TOWER COMMAND=SET_HEATER_TEMPERATURE PARAMETER=TARGET START={start} STEP_DELTA={delta} STEP_HEIGHT={height}
    RESPOND MSG="temperature tower armed: {start} C, {delta} C every {height} mm. Print the tower now; a restart clears it."

[gcode_macro TUNE_INPUT_SHAPER]
description: Tune | home and measure the input shaper (needs an accelerometer); SAVE_CONFIG afterwards to keep it
gcode:
    {% if printer.configfile.settings.resonance_tester is defined %}
      G28
      SHAPER_CALIBRATE
    {% else %}
      RESPOND TYPE=error MSG="no [resonance_tester] on this printer - fit an accelerometer first"
    {% endif %}

[gcode_macro _DISABLE_FS]
description: Filament | filament sensor off (during load/unload/colour change), if this printer has one
gcode:
    {% set s = printer["gcode_macro _FARM_PRINTER"].sensor %}
    {% if s %}
      SET_FILAMENT_SENSOR SENSOR={s} ENABLE=0
    {% endif %}

[gcode_macro _ENABLE_FS]
description: Filament | filament sensor back on, if this printer has one
gcode:
    {% set s = printer["gcode_macro _FARM_PRINTER"].sensor %}
    {% if s %}
      SET_FILAMENT_SENSOR SENSOR={s} ENABLE=1
    {% endif %}

[gcode_macro M205]
description: Print | slicer jerk (M205 X/Y) as Klipper's square corner velocity
gcode:
    {% if 'X' in params %}
      SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={params.X}
    {% elif 'Y' in params %}
      SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={params.Y}
    {% endif %}

[gcode_macro M900]
description: Print | slicer linear advance (M900 K) as Klipper's pressure advance
gcode:
    {% if 'K' in params %}
      {% if 'E' in params %}
        SET_PRESSURE_ADVANCE EXTRUDER={params.E} ADVANCE={params.K}
      {% else %}
        SET_PRESSURE_ADVANCE ADVANCE={params.K}
      {% endif %}
    {% endif %}
