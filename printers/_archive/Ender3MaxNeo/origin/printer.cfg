[include fluidd.cfg]

[include macros.cfg] 

[include btt_sfs_2.0.cfg]

[exclude_object]

[include KAMP_Settings.cfg]

[mcu]
serial: /dev/serial/by-path/pci-0000:00:14.0-usb-0:3.2:1.0-port0
restart_method: command

[virtual_sdcard]
path: /home/aali/Ender3MaxNeo_data/gcodes
on_error_gcode: CANCEL_PRINT

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 200

[temperature_sensor Enders3DPServer]
sensor_type: temperature_host
min_temp: 10
max_temp: 100


# This file contains pin mappings for the stock 2020 Creality Ender 3
# MAX. To use this config, during "make menuconfig" select the
# STM32F103 with a "28KiB bootloader" and serial (on USART1 PA10/PA9)
# communication.

# Because this printer has factory wiring, mounts, and firmware for
# a BLTouch, but does not ship with one at this time, default values
# for the sensor have been specified, but disabled, in anticipation of
# future revisions or user modification. User should take care to
# customize the offsets, particularly z-offset, for their specific unit.

# If you prefer a direct serial connection, in "make menuconfig"
# select "Enable extra low-level configuration options" and select
# serial (on USART3 PB11/PB10), which is broken out on the 10 pin IDC
# cable used for the LCD module as follows:
# 3: Tx, 4: Rx, 9: GND, 10: VCC

# Flash this firmware by copying "out/klipper.bin" to a SD card and
# turning on the printer with the card inserted. The firmware
# filename must end in ".bin" and must not match the last filename
# that was flashed.

# See docs/Config_Reference.md for a description of parameters.



[display_status]

[pause_resume]

[respond]

[idle_timeout]
#gcode:
#   A list of G-Code commands to execute on an idle timeout. See
#   docs/Command_Templates.md for G-Code format. The default is to run
#   "TURN_OFF_HEATERS" and "M84".
timeout: 3600
#   Idle time (in seconds) to wait before running the above G-Code
#   commands. The default is 600 seconds.
 
#====================================================================
# Stepper X
#====================================================================
[stepper_x]
step_pin: PB9
dir_pin: PC2
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA5
position_endstop: 0
position_max: 300 
homing_speed: 80
 
#====================================================================
# Stepper Y
#====================================================================
[stepper_y]
step_pin: PB7
dir_pin: PB8
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
#rotation_distance: 45 #my work
endstop_pin: ^PA6
position_endstop: 0
position_max: 300 #my work
homing_speed: 80
 
#====================================================================
# Stepper Z
#====================================================================
[stepper_z]
step_pin: PB5
dir_pin: !PB6
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop  #enable to use bltouch
# endstop_pin: ^PA7   #disable to use bltouch
# position_endstop: 0.0  #disable to use bltouch
position_max: 340
position_min: -10
homing_speed: 4
second_homing_speed: 1
homing_retract_dist: 2.0
 
#====================================================================
# Extruder
#====================================================================
[extruder]
max_extrude_only_distance: 100.0
#0.8 mm nozzle based on max_extrude_cross_section: (4.0 x (nozzle diameter x nozzle diameter) )
#max_extrude_cross_section: 0.64
step_pin: PB3
dir_pin: PB4
enable_pin: !PC3
microsteps: 16
rotation_distance: 7.53
nozzle_diameter: 0.600
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
#control: pid
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
min_temp: 0
max_temp: 300
pressure_advance: 0.072 
max_extrude_cross_section: 5

[verify_heater extruder]
check_gain_time: 200
hysteresis: 5
 
 
[heater_bed]
heater_pin: PA2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
#control: pid
# tuned for stock hardware with 50 degree Celsius target
#pid_Kp: 67.104
#pid_Ki: 0.544
#pid_Kd: 2068.466
min_temp: 0
max_temp: 130
 
[fan]
pin: PA0
 
[fan_generic extruder_partfan]
# pin: PB15
pin: PC6
#max_power:
#shutdown_speed:
#cycle_time:
#hardware_pwm:
#kick_start_time:
#off_below:
#tachometer_pin:
#tachometer_ppr:
#tachometer_poll_interval:
#   See the "fan" section for a description of the above parameters.
#heater: extruder
#   Name of the config section defining the heater that this fan is
#   associated with. If a comma separated list of heater names is
#   provided here, then the fan will be enabled when any of the given
#   heaters are enabled. The default is "extruder".
#heater_temp: 50.0
#   A temperature (in Celsius) that the heater must drop below before
#   the fan is disabled. The default is 50 Celsius.
#fan_speed: 1.0
#   The fan speed (expressed as a value from 0.0 to 1.0) that the fan
#   will be set to when its associated heater is enabled. The default
#   is 1.0
 
 
[heater_fan heater_partfan]
pin: PB14
#max_power:
#shutdown_speed:
#cycle_time:
#hardware_pwm:
#kick_start_time:
#off_below:
#tachometer_pin:
#tachometer_ppr:
#tachometer_poll_interval:
#   See the "fan" section for a description of the above parameters.
#heater: extruder
#   Name of the config section defining the heater that this fan is
#   associated with. If a comma separated list of heater names is
#   provided here, then the fan will be enabled when any of the given
#   heaters are enabled. The default is "extruder".
#heater_temp: 50.0
#   A temperature (in Celsius) that the heater must drop below before
#   the fan is disabled. The default is 50 Celsius.
#fan_speed: 1.0
#   The fan speed (expressed as a value from 0.0 to 1.0) that the fan
#   will be set to when its associated heater is enabled. The default
#   is 1.0
 
 
[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 5000
# max_accel_to_decel: 7000
max_z_velocity: 5
square_corner_velocity: 5.0
max_z_accel: 100
 
#====================================================================
# Resonance Sensor
#====================================================================
 
#[mcu rpi]
#serial: /tmp/klipper_host_mcu
 
#[adxl345]
#cs_pin: rpi:None
#spi_speed: 2000000
#spi_bus: spidev2.0
 
#[resonance_tester]
#accel_chip: adxl345
#accel_per_hz: 70
#probe_points:
#    117.5,117.5,10
 
 
 
 
[input_shaper]
shaper_type_x = mzv
shaper_freq_x = 89.8
shaper_type_y = mzv
shaper_freq_y = 35.2
 
#====================================================================
# CR Touch
#====================================================================
 
[bltouch]
sensor_pin: ^PB1
control_pin: PB0
x_offset: 10
y_offset: -60.0
#z_offset: 0
speed: 20
samples: 1
sample_retract_dist: 8.0
stow_on_each_sample = false #high speed for bltoch
[safe_z_home]
home_xy_position: 181, 195 # Places the probe exactly at 150, 150
speed: 150
z_hop: 10
z_hop_speed: 10
 
#====================================================================
# Bed Mesh
#====================================================================
 
[bed_mesh]
speed: 120
mesh_min: 50,0         #need to handle head distance with bl_touch
mesh_max: 310,240      #max probe range
probe_count: 8,8
fade_start: 1
fade_end: 10
fade_target: 0
algorithm: bicubic
 

[screws_tilt_adjust]
screw1: 57, 69
screw1_name: Front Left
screw2: 297, 69
screw2_name: Front Right
screw3: 297, 297
screw3_name: Back Right
screw4: 57, 297
screw4_name: Back Left
horizontal_move_z: 5
speed: 150
screw_thread: CW-M4

 
# [delayed_gcode AUTOSTART]
# initial_duration: 1
# gcode:
#   TURN_ON_MOTORS
[firmware_retraction]
retract_length: 0.72 #tower calc
#retract_length: 1.3 #Eryone Carbon Fibre PETG
#   The length of filament (in mm) to retract when G10 is activated,
#   and to unretract when G11 is activated (but see
#   unretract_extra_length below). The default is 0 mm.
retract_speed: 45
#retract_speed: 85 #Eryone Carbon Fibre PETG
#   The speed of retraction, in mm/s. The default is 20 mm/s.
#unretract_extra_length: 0
#   The length (in mm) of *additional* filament to add when
#   unretracting.
unretract_speed: 45
#unretract_speed: 85
#   The speed of unretraction, in mm/s. The default is 10 mm/s.
 
[gcode_macro G29]				#界面中增加G29指令
gcode:
  G28
  bed_mesh_calibrate
  G1 X0 Y0 Z10 F4200
  # save_config
 
[gcode_macro BED_LEVEL]
gcode:
    G28
    BED_MESH_CALIBRATE
 
 
[gcode_macro Z_AXI_CALIBRATE]
gcode:
    G28
    PROBE_CALIBRATE
 
[gcode_macro SHAPER]
gcode:
    G28
    SHAPER_CALIBRATE
 
[gcode_macro PID]
gcode:
    G28
    PID_CALIBRATE HEATER=extruder TARGET=210
    PID_CALIBRATE HEATER=heater_bed TARGET=70
 
[gcode_macro Press_Advance_short]
gcode:
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=1 ACCEL=500
    TUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE PARAMETER=ADVANCE START=0 FACTOR=.005
 
[gcode_macro Press_Advance_long]
gcode:
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=1 ACCEL=500
    TUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE PARAMETER=ADVANCE START=0 FACTOR=.020

[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True  ; use custom park coordinates
variable_custom_park_x    : 0.0   ; Park at X0 (left)
variable_custom_park_y    : 295.0 ; Park at back of the Max Neo bed
variable_custom_park_dz   : 10.0  ; Lift Z 10mm when parking
variable_retract          : 1.5   ; Retract when pausing
variable_cancel_retract   : 5.0   ; Retract when cancelling to prevent oozing
variable_speed_retract    : 35.0  ; Retract speed
variable_unretract        : 1.5   ; Unretract on resume
variable_park_at_cancel   : True  ; Move to park position when cancelling
