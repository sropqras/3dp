[include fluidd.cfg]
[include macros.cfg]
[include timelapse.cfg]
[include KAMP_Settings.cfg]
[respond]
#[include shell_command.cfg]
#[include adxl.cfg]

[mcu]
# CH340 like the other farm boards: by-path (the USB port), set at cut-over
serial: /dev/serial/by-path/pci-0000:00:14.0-usb-0:3.3:1.0-port0
restart_method: command

[virtual_sdcard]
path: /home/aali/printer_s1pro_data/gcodes
on_error_gcode: CANCEL_PRINT

# This file contains pin mappings for the Creality "v4.2.7" board. To
# use this config, during "make menuconfig" select the STM32F103 with
# a "28KiB bootloader" and serial (on USART1 PA10/PA9) communication.

# If you prefer a direct serial connection, in "make menuconfig"
# select "Enable extra low-level configuration options" and select
# serial (on USART3 PB11/PB10), which is broken out on the 10 pin IDC
# cable used for the LCD module as follows:
# 3: Tx, 4: Rx, 9: GND, 10: VCC

# Flash this firmware by copying "out/klipper.bin" to a SD card and
# turning on the printer with the card inserted. The firmware
# filename must end in ".bin" and must not match the last filename
# that was flashed.

# See docs/Config_Reference.md for a description of parameters.
[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[idle_timeout]
# Farm baseline (was "never" on the SBC). After 60 min paused only the nozzle cools; bed and motors hold the
# print. RESUME reheats. A 12 h cap (_PAUSE_HARD_STOP, macros.cfg) then turns the bed off too.
gcode:
  {% if printer.pause_resume.is_paused %}
    M104 S0
    UPDATE_DELAYED_GCODE ID=_PAUSE_HARD_STOP DURATION=41400
    RESPOND TYPE=echo MSG="Paused 30 min: nozzle off, bed and motors kept on. Bed turns off after 12 h paused. RESUME reheats."
    RESPOND PREFIX=tgnotify MSG="s1pro: still paused after 30 min - nozzle off, bed holding the print"
  {% else %}
    TURN_OFF_HEATERS
    M84
  {% endif %}
timeout: 3600

[display_status]

[exclude_object]
##################Creality Ender 3 S1 Pro Klipper Config - 3DPrintBeginner###############
######Full guide: https://3dprintbeginner.com/how-to-install-klipper-on-ender-3-s1/######
[pause_resume]
# farm baseline: a slow return from the park corner oozes across the plate
recover_velocity: 150

[stepper_x]
step_pin: PC2
dir_pin: PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: !PA5
position_endstop: -5
position_min: -5
position_max: 252
homing_speed: 50

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: !PA6
position_endstop: -5
position_min: -5
position_max: 232
homing_speed: 50

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 270
position_min: -5

[extruder]
max_extrude_only_distance: 100.0
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
rotation_distance: 7.53
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
#control: pid
#pid_kp = 19.687
#pid_ki = 1.058
#pid_kd = 91.543
min_temp: 0
max_temp: 300
pressure_advance = 0.04 #from V2 tuning #0.04
max_extrude_cross_section: 5

[filament_switch_sensor RunoutSensor]
pause_on_runout: True
runout_gcode: PAUSE
#insert_gcode: RESUME
switch_pin: !PC15

[heater_bed]
heater_pin: PA7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
#control: pid
#pid_Kp: 68.385
#pid_Ki: 1.093
#pid_Kd: 1069.370
min_temp: 0
max_temp: 130


[heater_fan hotend_fan]
pin: PC0
heater: extruder
heater_temp: 50.0

[fan]
pin: PA0

[printer]
kinematics: cartesian
# farm baseline (farm/audit.py); was 1000 / 4800 on the SBC - raise per printer once audit allows it
max_velocity: 200
max_accel: 3000
#max_accel_to_decel: 3000
max_z_velocity: 5
square_corner_velocity: 5.0
max_z_accel: 100

[bltouch]
sensor_pin: ^PC14 
control_pin: PC13 
x_offset: -32
y_offset: -41
#z_offset: 2.900
speed:10
samples:1
samples_result:average
probe_with_touch_mode: true
stow_on_each_sample: false

[safe_z_home]
home_xy_position: 147,154
speed: 100
z_hop: 10
z_hop_speed: 5

[bed_mesh]
speed: 100
mesh_min: 7, 7
mesh_max: 220, 185
algorithm: bicubic
probe_count: 5,4
fade_start: 1
fade_end: 3
fade_target: 0
mesh_pps: 2,2
bicubic_tension: 0.2

[firmware_retraction]
retract_length: 1.48 #tower test 74mm heigh with 0.2
#retract_length: 1.3 #Eryone Carbon Fibre PETG
#   The length of filament (in mm) to retract when G10 is activated,
#   and to unretract when G11 is activated (but see
#   unretract_extra_length below). The default is 0 mm.
retract_speed: 30
#retract_speed: 85 #Eryone Carbon Fibre PETG
#   The speed of retraction, in mm/s. The default is 20 mm/s.
#unretract_extra_length: 0
#   The length (in mm) of *additional* filament to add when
#   unretracting.
unretract_speed: 30
#unretract_speed: 85
#   The speed of unretraction, in mm/s. The default is 10 mm/s.

