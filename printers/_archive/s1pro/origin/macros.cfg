# s1pro on enders3dp: the farm-baseline macros of enders1plus (same sensor naming, Klipper v0.13)
#https://github.com/rootiest/zippy_guides/blob/main/guides/macros.md
[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(70)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(220)|float %}
    # Clear any stale pause state, otherwise PAUSE answers "Print already paused" and the print carries on
    CLEAR_PAUSE
    # A print cancelled during an M600 leaves the runout sensor disabled
    _ENABLE_FS
    # Pre-heat nozzle to a non-oozing temp (150C) so it's ready to go faster later
    M104 S150
    # Heat bed for probing and wait for it
    M190 S{BED_TEMP}
    # Use absolute coordinates
    G90
    # Home the printer
    G28
    # Generate an adaptive bed mesh only around the print area
    BED_MESH_CALIBRATE ADAPTIVE=1
    # Smart Park or standard move close to the bed before final heat
    G1 Z5 F3000
    # Set and wait for nozzle to reach final printing temperature
    M109 S{EXTRUDER_TEMP}
    # Start printing with KAMP line purge!
    LINE_PURGE

    
[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
# change this if you need more or less extrusion
variable_extrude: 1.0
gcode:
  ##### read E from pause macro #####
  {% set E = printer["gcode_macro PAUSE"].extrude|float %}
  ##### set park positon for x and y #####
  # default is your max posion from your printer.cfg
  {% set x_park = printer.toolhead.axis_maximum.x|float - 5.0 %}
  {% set y_park = printer.toolhead.axis_maximum.y|float - 5.0 %}
  ##### calculate save lift position #####
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% if act_z < (max_z - 2.0) %}
      {% set z_safe = 2.0 %}
  {% else %}
      {% set z_safe = max_z - act_z %}
  {% endif %}
  ##### end of definitions #####
  # remember temperatures so RESUME can reheat after the idle timeout / 12 h cap cooled things down
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=saved_extruder VALUE={printer.extruder.target}
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=saved_bed VALUE={printer.heater_bed.target}
  PAUSE_BASE
  G91
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G1 E-{E} F2100
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}
  {% if "xyz" in printer.toolhead.homed_axes %}
    G1 Z{z_safe} F900
    G90
    G1 X{x_park} Y{y_park} F6000
  {% else %}
    {action_respond_info("Printer not homed")}
  {% endif %} 

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
variable_saved_extruder: 0
variable_saved_bed: 0
gcode:
  ##### read E from pause macro #####
  {% set E = printer["gcode_macro PAUSE"].extrude|float %}
  ##### undo the paused-idle cool-down before moving #####
  UPDATE_DELAYED_GCODE ID=_PAUSE_HARD_STOP DURATION=0
  {% if saved_bed > 0 and printer.heater_bed.target == 0 %}
    RESPOND TYPE=echo MSG="Reheating bed to {saved_bed} before resuming"
    M190 S{saved_bed}
  {% endif %}
  {% if saved_extruder > 0 and printer.extruder.target == 0 %}
    RESPOND TYPE=echo MSG="Reheating nozzle to {saved_extruder} before resuming"
    M109 S{saved_extruder}
  {% endif %}
  SET_IDLE_TIMEOUT TIMEOUT=3600
  _ENABLE_FS
  #### get VELOCITY parameter if specified ####
  {% if 'VELOCITY' in params|upper %}
    {% set get_params = ('VELOCITY=' + params.VELOCITY)  %}
  {%else %}
    {% set get_params = "" %}
  {% endif %}
  ##### end of definitions #####
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G91
    G1 E{E} F2100
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}  
  RESUME_BASE {get_params}

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
  TURN_OFF_HEATERS
  {% if "xyz" in printer.toolhead.homed_axes %}
    G91
    G1 Z4.5 F300
    G90
  {% else %}
    {action_respond_info("Printer not homed")}
  {% endif %}
    G28 X Y
  {% set y_park = printer.toolhead.axis_maximum.y|float - 5.0 %}
    G1 Y{y_park} F2000
    M84
  CANCEL_PRINT_BASE

[gcode_macro M600]
description: Colour change - park and prompt; filament only moves when the operator presses a button
gcode:
    # No auto-unload: an unattended eject lets the loose filament end spring back and tangle on the spool.
    # Sensor off for the swap so loading/unloading can't trigger runout/insert actions.
    PAUSE_MACRO
    _DISABLE_FS
    _COLOUR_CHANGE_PROMPT

[gcode_macro PAUSE_MACRO]
description: Pause and park; the nozzle cools after 30 min paused (see [idle_timeout])
gcode:
    PAUSE
    SET_IDLE_TIMEOUT TIMEOUT=1800

[gcode_macro _COLOUR_CHANGE_PROMPT]
gcode:
    # Telegram (moonraker-telegram-bot): loud alert + camera photo so someone comes to swap
    RESPOND PREFIX=tgalarm_photo MSG="s1pro: colour change - load the next colour, PURGE, then RESUME"
    RESPOND TYPE=command MSG="action:prompt_begin Colour change"
    RESPOND TYPE=command MSG="action:prompt_text Hold the filament, press UNLOAD and clip the old end to its spool."
    RESPOND TYPE=command MSG="action:prompt_text Insert the next colour, press LOAD, PURGE until it runs clean, remove the blob, wipe the nozzle, then RESUME."
    RESPOND TYPE=command MSG="action:prompt_button UNLOAD|UNLOAD_FILAMENT|error"
    RESPOND TYPE=command MSG="action:prompt_button LOAD 75mm|LOAD_FILAMENT|primary"
    RESPOND TYPE=command MSG="action:prompt_button PURGE 45mm|PURGE|secondary"
    RESPOND TYPE=command MSG="action:prompt_footer_button RESUME|_COLOUR_CHANGE_RESUME|warning"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _COLOUR_CHANGE_RESUME]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    # relieve nozzle pressure after PURGE so it doesn't ooze a ring across the plate on the way back
    M83
    G1 E-2 F1800
    G4 P2000
    RESUME

# 12 h safety cap on a pause: all heaters off, motors keep holding position so the print can still resume
[delayed_gcode _PAUSE_HARD_STOP]
gcode:
    {% if printer.pause_resume.is_paused %}
      TURN_OFF_HEATERS
      RESPOND TYPE=echo MSG="Paused 12 h: all heaters off, motors still holding. RESUME reheats - check the plates are still stuck first."
      RESPOND PREFIX=tgalarm MSG="s1pro: paused 12 h - all heaters OFF. Check the plates are still stuck before RESUME."
    {% endif %}

[gcode_macro FC_RESUME]
gcode:
    ##### read E from pause macro #####
    {% set E = printer["gcode_macro PAUSE"].extrude|float %}
    SET_IDLE_TIMEOUT TIMEOUT={ 10 * 60 }
    G1 E-{ E }
    # Reset extruder position
    G92 E0
    RESUME

[gcode_macro UNLOAD_FILAMENT]
gcode:
    SAVE_GCODE_STATE NAME=UNLOAD_state
    {% set z_lift = params.z_lift|default(50)|int %}
    {% set axis_max = printer.toolhead.axis_maximum %}
    {% set pos = printer.toolhead.position %}

    {% set z_diff = axis_max.z - pos.z %}
    {% set z_safe_lift = [ z_lift, z_diff ] | min%}
    
    G91                   # relative positioning
    G0 Z{ z_safe_lift }
    # Reset extruder position
    G92 E0
    G1 E5.0 F300        # extrude a little
    G1 E-50 F{ 10 * 60 } # perform the unload
    G1 E-50 F{ 5 * 60 }   # finish the unload
    RESTORE_GCODE_STATE NAME=UNLOAD_state

[gcode_macro PURGE]
gcode:
    SAVE_GCODE_STATE NAME=PURGE_state
    G91                   # relative coords
    G1 E45.0 F{ 5 * 60 }  # purge
    RESTORE_GCODE_STATE NAME=PURGE_state

[gcode_macro LOAD_FILAMENT]
gcode:
    SAVE_GCODE_STATE NAME=LOAD_state
    G91                   # Relative coords
    G1 E50 F{ 5 * 60 }  # extrude
    G4 P{ 0.9 * 1000 }    # dwell (ms)
    G1 E25.0 F{ 5 * 60 }  # extrude a little more
    _ENABLE_FS
    RESTORE_GCODE_STATE NAME=LOAD_state

[gcode_macro _DISABLE_FS]
description: placeholder, disables filament sensor that might trigger an M600 in the middle of a load/unload/M600...
gcode:
    SET_FILAMENT_SENSOR SENSOR=RunoutSensor ENABLE=0

[gcode_macro _ENABLE_FS]
description: placeholder, enables filament sensor
gcode:
    SET_FILAMENT_SENSOR SENSOR=RunoutSensor ENABLE=1

[gcode_macro HEAT]
gcode:
  SET_HEATER_TEMPERATURE HEATER=extruder TARGET=210
  G28
  G1 Z10 F3000

[gcode_macro COOL]
gcode:
  TURN_OFF_HEATERS

[gcode_macro BED_TRAMMING_1]
gcode:
  {% set BED_TEMP = params.BED_TEMP|default(70)|float %}
  M140 S{BED_TEMP}	
  G28
  M190 S{BED_TEMP}
  SCREWS_TILT_CALCULATE

[gcode_macro BED_TRAMMING_2]
gcode:
  SCREWS_TILT_CALCULATE

[gcode_macro BED_MESH]
gcode:
  {% set BED_TEMP = params.BED_TEMP|default(70)|float %}
  M140 S{BED_TEMP}
  G28
  M190 S{BED_TEMP}
  BED_MESH_CLEAR
  BED_MESH_CALIBRATE
  TURN_OFF_HEATERS
  SAVE_CONFIG

[gcode_macro DISABLE_STEPPERS]
gcode:
  M84 X Y E

[gcode_macro PID_EXTRUDER]
gcode:
  PID_CALIBRATE HEATER=extruder TARGET=210
  TURN_OFF_HEATERS
  SAVE_CONFIG

[gcode_macro PID_BED]
gcode:
  PID_CALIBRATE HEATER=heater_bed TARGET=70
  TURN_OFF_HEATERS
  SAVE_CONFIG

[gcode_macro NOZZLE_MID]
gcode:
  G28
  G1 X110 Y110 Z10 F6000

# [screws_tilt_adjust] left out: the S1 Plus screw positions don't fit the S1 Pro bed; measure before adding

[gcode_macro PRINT_END]
description: End of printing
variable_machine_depth: 220
gcode:
      G91 ;Relative positioning
      G1 E-2 F2700 ;Retract a bit
      G1 E-2 Z0.2 F2400 ;Retract and raise Z
      G1 X5 Y5 F3000 ;Wipe out
      G1 z50 ;Raise Z more
      G90 ;Absolute positioning
      G1 X0 Y{machine_depth} ;Present print
      M106 S0 ;Turn-off fan
      M104 S0 ;Turn-off hotend
      M140 S0 ;Turn-off bed
      M84 X Y E ;Disable all steppers but Z
      BEEP
 #     UPDATE_DELAYED_GCODE ID=DELAYED_PRINTER_OFF DURATION=60
 #     WLED_ON STRIP=roof PRESET=4

[gcode_macro M900]
gcode:
  {% if 'K' in params %}
    {% if 'E' in params %}
      SET_PRESSURE_ADVANCE EXTRUDER={params.E} ADVANCE={params.K}
    {% else %}
      SET_PRESSURE_ADVANCE ADVANCE={params.K}
    {% endif %}
  {% endif %}

[gcode_macro M204]
rename_existing: M204.1
gcode:
  # {% if printer['gcode_macro Qmode'].flag|int == 0 %}
  {% set get_params = "" %}
  {% if 'S' in params|upper %}
    {% set get_params = (get_params + ' ' + 'S' + params.S) %}
  {% endif %}
  {% if 'P' in params|upper %}
    {% set get_params = (get_params + ' ' + 'P' + params.P) %}
  {% endif %}
  {% if 'T' in params|upper %}
    {% set get_params = (get_params + ' ' + 'T' + params.T) %}
  {% endif %}
  M204.1 {get_params}
  # {% endif %}

[gcode_macro M205]
gcode:
  {% if 'X' in params %}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={params.X}
  {% elif 'Y' in params %}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={params.Y}
  {% endif %}

[gcode_macro G29]
gcode:
  M204 S5000
  G90
  M104S0
  M107
  G28
  BED_MESH_CALIBRATE
  G1 X110Y110Z10
  M140S0

[gcode_macro BED_TRAMMING_AUTOMATED]
description: Heated automated bed leveling loop. Adjust knobs until the macro exits.
gcode:
  {% set BED_TEMP = params.BED_TEMP|default(70)|float %}
  
  # 1. Turn on heaters and home
  RESPOND MSG="Heating bed to {BED_TEMP}°C for calibration..."
  M140 S{BED_TEMP}	
  G28
  M190 S{BED_TEMP}
  
  # 2. Run the automated leveling checks loop
  RESPOND MSG="Starting automated bed leveling loop. Adjust knobs as instructed in the console."
  SCREWS_TILT_CALCULATE MAX_DEVIATION=0.05 RETRY_TOLERANCE=0.02

[gcode_macro BED_TRAMMING_CONTINUE]
description: Use this to manually run another check if you paused or adjusted mid-way.
gcode:
  SCREWS_TILT_CALCULATE MAX_DEVIATION=0.05 RETRY_TOLERANCE=0.02

[gcode_macro UI_BED_TRAM_CHECK]
description: Preheats bed and launches Fluidd's visual leveling script
gcode:
  {% set BED_TEMP = params.BED_TEMP|default(70)|float %}
  G28
  M190 S{BED_TEMP}
  SCREWS_TILT_CALCULATE

[gcode_macro CALIBRATE_Z_UI]
description: Homes and triggers the Fluidd Z-Offset UI
gcode:
    G28
    G1 X150 Y150 Z10 F6000
    PROBE_CALIBRATE
