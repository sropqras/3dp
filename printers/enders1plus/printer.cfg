[exclude_object]

[include macros.cfg]
[include timelapse.cfg]
[include KAMP_Settings.cfg]
[respond]
[mcu]
serial: /dev/serial/by-path/pci-0000:00:14.0-usbv2-0:4:1.0-port0
restart_method: command

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT


# This file contains pin mappings for the Creality "v4.2.7" board. To
# use this config, during "make menuconfig" select the STM32F103 with
# a "28KiB bootloader" and serial (on USART1 PA10/PA9) communication.

# If you prefer a direct serial connection, in "make menuconfig"
# select "Enable extra low-level configuration options" and select
# serial (on USART3 PB11/PB10), which is broken out on the 10 pin IDC
# cable used for the LCD module as follows:
# 3: Tx, 4: Rx, 9: GND, 10: VCC

# Flash this firmware by copying "out/klipper.bin" to a SD card and
# turning on the printer with the card inserted. The firmware
# filename must end in ".bin" and must not match the last filename
# that was flashed.

# See docs/Config_Reference.md for a description of parameters.
[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor EndersTestPad]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[filament_switch_sensor RunoutSensor]
pause_on_runout: False
runout_gcode: PAUSE
# Was RESUME: inserting new filament during a pause resumed the print before it was loaded/purged
# ("snapped right back"). Resuming is always the operator's button now.
insert_gcode:
  RESPOND TYPE=echo MSG="Filament detected - LOAD and PURGE, then press RESUME"
switch_pin: !PC15

[display_status]

##################Creality Ender 3 S1 Pro Klipper Config - 3DPrintBeginner###############
######Full guide: https://3dprintbeginner.com/how-to-install-klipper-on-ender-3-s1/######

[idle_timeout]
# Was 99999999 (never): heaters could stay on indefinitely. While paused (e.g. overnight on an M600
# colour swap) only the nozzle cools; bed and motors stay on so the print can resume. RESUME reheats.
# A 12 h cap (_PAUSE_HARD_STOP, macros.cfg) then turns the bed off too.
gcode:
  {% if printer.pause_resume.is_paused %}
    M104 S0
    UPDATE_DELAYED_GCODE ID=_PAUSE_HARD_STOP DURATION=41400
    RESPOND TYPE=echo MSG="Paused 30 min: nozzle off, bed and motors kept on. Bed turns off after 12 h paused. RESUME reheats."
  {% else %}
    TURN_OFF_HEATERS
    M84
  {% endif %}
timeout: 3600

[stepper_x]
step_pin: PC2
dir_pin: PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: !PA5
position_endstop: -10
position_max: 316
position_min: -15
homing_speed: 50

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: !PA6
position_endstop: -10
position_max: 304
position_min: -15
homing_speed: 50

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 300
position_min: -4

[extruder]
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
gear_ratio: 42:12
rotation_distance: 26.359
nozzle_diameter: 0.600
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
#control: pid
#pid_Kp: 23.561
#pid_Ki: 1.208
#pid_Kd: 114.859
min_temp: -100
max_temp: 265
max_extrude_only_distance: 100
pressure_advance: 0.08 #0.074 #orca test #0.085
max_extrude_cross_section: 5
[heater_bed]
heater_pin: PA7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
#control: pid
#pid_Kp: 71.867
#pid_Ki: 1.536
#pid_Kd: 840.843
min_temp: 0
max_temp: 100

[heater_fan hotend_fan]
pin: PC0

[fan]
pin: PA0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 2000
max_z_velocity: 5
max_z_accel: 100

[bltouch]
sensor_pin: ^PC14
control_pin: PC13
x_offset: -31.8
y_offset: -40.5
#z_offset = 3.840
stow_on_each_sample: False   # Keeps the pin deployed between points instead of constant cycling
probe_with_touch_mode: False
pin_move_time: 0.68          # Gives the pin more time to physically move (Default is 0.5)
lift_speed: 5                   # Slows down the Z lift slightly so the probe doesn't bounce or drop falsely

[bed_mesh]
speed: 120
mesh_min: 35, 20
mesh_max: 283, 263
probe_count: 6,6
algorithm: bicubic
bicubic_tension: 0.2

[safe_z_home]
home_xy_position: 187, 192
speed: 75
z_hop: 10
z_hop_speed: 10

[pause_resume]
# was 25: a slow return from the park corner oozes across the plates
recover_velocity: 150

[firmware_retraction]
retract_length: 1.48 #0.4
retract_speed: 30 #45
unretract_speed: 30 #45

#[include shell_command.cfg]

[include shell_command.cfg]

